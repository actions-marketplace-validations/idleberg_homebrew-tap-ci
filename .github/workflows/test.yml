name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        fixture: [pass, fail]
        include:
          - fixture: pass
            expect: success
            failed: ""
          - fixture: fail
            expect: failure
            failed: ci/fixture/hello-broken (test)
    runs-on: ${{ matrix.os }}

    steps:
      # Also checks this repository out into the workspace
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ github.token }}
          # Latest Homebrew release, what users run, rather than unreleased main
          stable: true

      # setup-homebrew owns the workspace, so the fixture becomes a separate tap with its own history
      - name: Tap fixture
        id: tap
        env:
          FIXTURE: test/fixtures/${{ matrix.fixture }}
          TAP_DIR: ${{ runner.temp }}/fixture-tap
        run: |
          git init --quiet "$TAP_DIR"
          git -C "$TAP_DIR" config user.name ci
          git -C "$TAP_DIR" config user.email ci@localhost

          for state in base head; do
            git -C "$TAP_DIR" rm -r --quiet --ignore-unmatch Formula Casks
            [[ -d $FIXTURE/$state ]] && cp -R "$FIXTURE/$state/." "$TAP_DIR"
            git -C "$TAP_DIR" add --all
            git -C "$TAP_DIR" commit --quiet --allow-empty --message "$state"
          done

          brew tap ci/fixture "$TAP_DIR"
          brew trust --tap ci/fixture
          echo "base=$(git -C "$TAP_DIR" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Run action
        id: check
        continue-on-error: true
        uses: ./
        with:
          setup-homebrew: false
          tap: ci/fixture
          base: ${{ steps.tap.outputs.base }}

      - name: Expect ${{ matrix.expect }}
        if: steps.check.outcome != matrix.expect || steps.check.outputs.failed != matrix.failed
        env:
          OUTCOME: ${{ steps.check.outcome }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          echo "::error::Expected ${{ matrix.expect }} with failed='${{ matrix.failed }}', got $OUTCOME with failed='$FAILED'"
          exit 1
